name: Build Android

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  # 1. Updated to your specific version
  UNITY_VERSION: 6000.3.6f1 

jobs:
  buildAndroid:
    name: Build for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Cache Library
        uses: actions/cache@v4 # 2. Upgraded to v4 (v3 is deprecated)
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # D) Resolve Dependencies
      - name: Resolve Android Dependencies
        uses: game-ci/unity-builder@v5 # 3. MUST be v5 for Unity 6
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          unityLicense: ${{ secrets.UNITY_LICENSE }} # 4. Changed 'c' to 's'
          targetPlatform: Android
          buildMethod: CIResolveDependencies.Resolve
          # androidAppBundle: false (Removed: this is not a valid input for this action)

      # E) Build APK
      - name: Build Android APK
        uses: game-ci/unity-builder@v5 # 5. MUST be v5 for Unity 6
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          unityLicense: ${{ secrets.UNITY_LICENSE }} # 6. Added missing license here
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBuild
          path: build/Android
