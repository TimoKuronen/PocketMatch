name: Build Android

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

  UNITY_VERSION: 6000.3.14f1

jobs:
  buildAndroid:
    name: Build for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # D) Resolve Dependencies
      - name: Resolve Android Dependencies
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          unityLicense: ${{ secrets.UNITY_LICENSE }} 
          targetPlatform: Android
          buildMethod: CIResolveDependencies.Resolve

      # E) Build APK
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          unityLicense: ${{ secrets.UNITY_LICENSE }}
          androidExportType: androidPackage
          allowDirtyBuild: true
          versioning: None
          androidVersionCode: ${{ github.run_number }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBuild
          path: build/Android
