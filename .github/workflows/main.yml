name: Build Android

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_VERSION: 6000.0.58f2

jobs:
  buildAndroid:
    name: Build for Android
    runs-on: ubuntu-latest

    steps:
      # A) Checkout (LFS REQUIRED)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      # B) Free disk space
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      # C) Cache Library
      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # D) Resolve Firebase / EDM dependencies (CRITICAL)
      - name: Resolve Android Dependencies
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          unityLicence: ${{ secrets.UNITY_LICENSE }}
          targetPlatform: Android
          buildMethod: CIResolveDependencies.Resolve
          androidAppBundle: false

      # E) Build APK (DEBUG SIGNING)
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          androidExportType: androidPackage
          androidKeystoreName: user.keystore
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          allowDirtyBuild: true

      # F) Upload artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBuild
          path: build/Android